<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laravel 13 Cheat Sheet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css" id="hljs-light">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" id="hljs-dark">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff2d20;
            --primary-hover: #e62416;

            /* Dark mode (default) */
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
            --code-bg: #1e293b;

            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --bg-secondary: #f8fafc;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --code-bg: #f9fafb;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Header */
        header {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .header-brand:hover {
            color: var(--primary-hover);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            max-width: 400px;
        }

        .search-input {
            flex: 1;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text);
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 45, 32, 0.15);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--border);
        }

        /* Layout */
        .layout {
            display: grid;
            grid-template-columns: 280px 1fr 300px;
            gap: 0;
            max-width: 1600px;
            margin: 0 auto;
            min-height: calc(100vh - 60px);
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            max-height: calc(100vh - 60px);
            overflow-y: auto;
            position: sticky;
            top: 60px;
        }

        .sidebar-section {
            margin-bottom: 2rem;
        }

        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0 1rem 0.75rem 0;
            margin-bottom: 0.5rem;
        }

        .sidebar-link {
            display: block;
            padding: 0.75rem 1rem;
            color: var(--text);
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            margin-bottom: 0.25rem;
            font-size: 0.95rem;
        }

        .sidebar-link:hover {
            background: var(--border);
            border-left-color: var(--primary);
            color: var(--primary);
        }

        .sidebar-link.active {
            background: rgba(255, 45, 32, 0.1);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        /* Main Content */
        .main {
            padding: 3rem 2rem;
            overflow-y: auto;
        }

        .page-title {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .page-description {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        /* Content */
        .content {
            max-width: 100%;
        }

        .content h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            color: var(--text);
            letter-spacing: -0.02em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .content h1:first-child {
            margin-top: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .content h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .content h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--primary);
        }

        .content p {
            margin-bottom: 1.25rem;
            color: var(--text);
            line-height: 1.8;
        }

        .content ul, .content ol {
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .content li {
            margin-bottom: 0.5rem;
            color: var(--text);
            line-height: 1.8;
        }

        .content code {
            background: var(--code-bg);
            color: var(--primary);
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 0.9em;
        }

        /* Code blocks */
        .code-block {
            margin: 1.5rem 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .code-block-header {
            background: var(--border);
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .code-label {
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .code-block pre {
            background: var(--code-bg);
            padding: 1rem;
            overflow-x: auto;
            margin: 0;
        }

        .code-block code {
            background: none;
            color: inherit;
            padding: 0;
            border-radius: 0;
            font-size: 0.9em;
            line-height: 1.6;
        }

        /* Right Sidebar - TOC */
        .toc-sidebar {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            padding: 2rem 1.5rem;
            max-height: calc(100vh - 60px);
            overflow-y: auto;
            position: sticky;
            top: 60px;
            font-size: 0.9rem;
        }

        .toc-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .toc-list {
            list-style: none;
        }

        .toc-item {
            margin-bottom: 0.5rem;
        }

        .toc-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
            display: block;
            padding: 0.25rem 0;
            border-left: 2px solid transparent;
            padding-left: 0.75rem;
        }

        .toc-link:hover {
            color: var(--primary);
        }

        .toc-link.active {
            color: var(--primary);
            border-left-color: var(--primary);
        }

        .toc-item.level-2 .toc-link {
            padding-left: 1.5rem;
        }

        .toc-item.level-3 .toc-link {
            padding-left: 2.25rem;
        }

        /* Views */
        .view {
            display: none;
        }

        .view.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .category-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
        }

        .category-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(255, 45, 32, 0.15);
            transform: translateY(-2px);
        }

        .category-card-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
            font-size: 1.1rem;
        }

        .category-card-count {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .back-button:hover {
            background: var(--primary-hover);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .layout {
                grid-template-columns: 240px 1fr;
            }

            .toc-sidebar {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                max-height: none;
                border-right: none;
                border-bottom: 1px solid var(--border);
                display: none;
            }

            .sidebar.open {
                display: block;
            }

            .main {
                padding: 1.5rem 1rem;
            }

            .page-title {
                font-size: 1.75rem;
            }

            .categories-grid {
                grid-template-columns: 1fr;
            }

            .header-controls {
                max-width: none;
                flex: 0;
            }

            .search-input {
                display: none;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <a href="#" class="header-brand" onclick="app.showHome(event)">
                Laravel 13 Cheat Sheet
            </a>
            <div class="header-controls">
                <input type="text" class="search-input" id="searchInput" placeholder="Search documentation..." autofocus>
                <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">🌙</button>
            </div>
        </div>
    </header>

    <!-- Layout -->
    <div class="layout">
        <!-- Left Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div id="sidebarContent"></div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- Home View -->
            <div id="homeView" class="view active">
                <div class="page-title">Laravel 13 Cheat Sheet</div>
                <p class="page-description">Comprehensive reference • PHP 8.2+ • Code examples • Quick lookup</p>
                <div class="categories-grid" id="homeGrid"></div>
            </div>

            <!-- Category View -->
            <div id="categoryView" class="view">
                <button class="back-button" onclick="app.showHome(event)">← Back</button>
                <div class="page-title" id="categoryTitle"></div>
                <div class="categories-grid" id="categoryGrid"></div>
            </div>

            <!-- File View -->
            <div id="fileView" class="view">
                <button class="back-button" onclick="app.showHome(event)">← Back</button>
                <div class="content" id="fileContent"></div>
            </div>

            <!-- Search View -->
            <div id="searchView" class="view">
                <button class="back-button" onclick="app.showHome(event)">← Back</button>
                <div class="page-title">Search Results</div>
                <div class="categories-grid" id="searchResults"></div>
            </div>

            <!-- Empty State -->
            <div id="emptyView" class="view">
                <div style="text-align: center; padding: 3rem 1rem; color: var(--text-secondary);">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">📝</div>
                    <p>No results found. Try a different search.</p>
                </div>
            </div>
        </main>

        <!-- Right Sidebar - TOC -->
        <aside class="toc-sidebar" id="tocSidebar">
            <div class="toc-title">On this page</div>
            <ul class="toc-list" id="tocList"></ul>
        </aside>
    </div>

    <script>
        const app = {
            files: [],
            categories: {},
            currentTheme: localStorage.getItem('theme') || 'dark',

            async init() {
                this.setupTheme();
                await this.loadFileIndex();
                this.renderSidebar();
                this.renderHome();
                this.setupEventListeners();
            },

            setupTheme() {
                document.documentElement.setAttribute('data-theme', this.currentTheme);
                this.updateThemeIcon();
                this.updateHighlightTheme();
            },

            updateThemeIcon() {
                const toggle = document.getElementById('themeToggle');
                toggle.textContent = this.currentTheme === 'dark' ? '☀️' : '🌙';
            },

            updateHighlightTheme() {
                const lightStyle = document.getElementById('hljs-light');
                const darkStyle = document.getElementById('hljs-dark');
                if (this.currentTheme === 'dark') {
                    lightStyle.disabled = true;
                    darkStyle.disabled = false;
                } else {
                    lightStyle.disabled = false;
                    darkStyle.disabled = true;
                }
            },

            toggleTheme() {
                this.currentTheme = this.currentTheme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('theme', this.currentTheme);
                this.setupTheme();
            },

            async loadFileIndex() {
                this.categories = {
                    '01-core': {
                        title: '📌 Core Framework',
                        files: [
                            { name: 'artisan', path: 'docs/cheatsheet/01-core/artisan.md' },
                            { name: 'application-bootstrap', path: 'docs/cheatsheet/01-core/application-bootstrap.md' },
                            { name: 'config', path: 'docs/cheatsheet/01-core/config.md' },
                            { name: 'routing', path: 'docs/cheatsheet/01-core/routing.md' },
                            { name: 'middleware', path: 'docs/cheatsheet/01-core/middleware.md' }
                        ]
                    },
                    '02-http': {
                        title: '🌐 HTTP',
                        files: [
                            { name: 'controllers', path: 'docs/cheatsheet/02-http/controllers.md' },
                            { name: 'requests', path: 'docs/cheatsheet/02-http/requests.md' },
                            { name: 'responses', path: 'docs/cheatsheet/02-http/responses.md' },
                            { name: 'redirects', path: 'docs/cheatsheet/02-http/redirects.md' },
                            { name: 'views-blade', path: 'docs/cheatsheet/02-http/views-blade.md' }
                        ]
                    },
                    '03-database': {
                        title: '💾 Database',
                        files: [
                            { name: 'eloquent-orm', path: 'docs/cheatsheet/03-database/eloquent-orm.md' },
                            { name: 'eloquent-scopes', path: 'docs/cheatsheet/03-database/eloquent-scopes.md' },
                            { name: 'factories', path: 'docs/cheatsheet/03-database/factories.md' },
                            { name: 'query-builder', path: 'docs/cheatsheet/03-database/query-builder.md' },
                            { name: 'schema-migrations', path: 'docs/cheatsheet/03-database/schema-migrations.md' }
                        ]
                    },
                    '04-auth': {
                        title: '🔐 Auth & Authorization',
                        files: [
                            { name: 'authentication-sanctum', path: 'docs/cheatsheet/04-auth/authentication-sanctum.md' },
                            { name: 'authorization', path: 'docs/cheatsheet/04-auth/authorization.md' }
                        ]
                    },
                    '05-communication': {
                        title: '💬 Communication',
                        files: [
                            { name: 'notifications', path: 'docs/cheatsheet/05-communication/notifications.md' },
                            { name: 'mail', path: 'docs/cheatsheet/05-communication/mail.md' }
                        ]
                    },
                    '06-utilities': {
                        title: '🛠️ Utilities',
                        files: [
                            { name: 'http-client', path: 'docs/cheatsheet/06-utilities/http-client.md' },
                            { name: 'cache', path: 'docs/cheatsheet/06-utilities/cache.md' },
                            { name: 'session', path: 'docs/cheatsheet/06-utilities/session.md' },
                            { name: 'cookies', path: 'docs/cheatsheet/06-utilities/cookies.md' },
                            { name: 'storage', path: 'docs/cheatsheet/06-utilities/storage.md' },
                            { name: 'logging', path: 'docs/cheatsheet/06-utilities/logging.md' }
                        ]
                    },
                    '07-patterns': {
                        title: '🏗️ Patterns',
                        files: [
                            { name: 'service-container', path: 'docs/cheatsheet/07-patterns/service-container.md' },
                            { name: 'service-providers', path: 'docs/cheatsheet/07-patterns/service-providers.md' }
                        ]
                    },
                    '08-data': {
                        title: '📊 Data Processing',
                        files: [
                            { name: 'collections', path: 'docs/cheatsheet/08-data/collections.md' },
                            { name: 'strings', path: 'docs/cheatsheet/08-data/strings.md' },
                            { name: 'arrays', path: 'docs/cheatsheet/08-data/arrays.md' },
                            { name: 'helpers', path: 'docs/cheatsheet/08-data/helpers.md' }
                        ]
                    },
                    '09-validation': {
                        title: '✅ Validation',
                        files: [
                            { name: 'validation', path: 'docs/cheatsheet/09-validation/validation.md' }
                        ]
                    },
                    '10-advanced': {
                        title: '🚀 Advanced',
                        files: [
                            { name: 'events-listeners', path: 'docs/cheatsheet/10-advanced/events-listeners.md' },
                            { name: 'jobs-queues', path: 'docs/cheatsheet/10-advanced/jobs-queues.md' },
                            { name: 'task-scheduling', path: 'docs/cheatsheet/10-advanced/task-scheduling.md' },
                            { name: 'testing', path: 'docs/cheatsheet/10-advanced/testing.md' }
                        ]
                    }
                };

                this.files = [];
                Object.entries(this.categories).forEach(([key, cat]) => {
                    cat.files.forEach(file => {
                        this.files.push({
                            ...file,
                            displayName: file.name.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase()),
                            category: cat.title,
                            categoryKey: key
                        });
                    });
                });
            },

            renderSidebar() {
                const sidebar = document.getElementById('sidebarContent');
                sidebar.innerHTML = '';
                Object.entries(this.categories).forEach(([key, cat]) => {
                    const section = document.createElement('div');
                    section.className = 'sidebar-section';
                    section.innerHTML = `<div class="sidebar-title">${cat.title}</div>`;
                    cat.files.forEach(file => {
                        const link = document.createElement('a');
                        link.href = '#';
                        link.className = 'sidebar-link';
                        link.textContent = file.name.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        link.addEventListener('click', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            this.loadFile(file.path, file.displayName);
                        });
                        section.appendChild(link);
                    });
                    sidebar.appendChild(section);
                });
            },

            renderHome() {
                const grid = document.getElementById('homeGrid');
                grid.innerHTML = '';
                Object.entries(this.categories).forEach(([key, cat]) => {
                    const card = document.createElement('a');
                    card.className = 'category-card';
                    card.innerHTML = `
                        <div class="category-card-title">${cat.title}</div>
                        <div class="category-card-count">${cat.files.length} sections</div>
                    `;
                    card.onclick = (e) => {
                        e.preventDefault();
                        this.showCategory(key);
                    };
                    grid.appendChild(card);
                });
                this.showView('homeView');
                this.updateTOC([]);
            },

            showHome(e) {
                if (e) e.preventDefault();
                document.getElementById('searchInput').value = '';
                this.renderHome();
            },

            showCategory(categoryKey) {
                const cat = this.categories[categoryKey];
                document.getElementById('categoryTitle').textContent = cat.title;
                const grid = document.getElementById('categoryGrid');
                grid.innerHTML = '';
                cat.files.forEach(file => {
                    const card = document.createElement('a');
                    card.className = 'category-card';
                    card.innerHTML = `
                        <div class="category-card-title">${file.name.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</div>
                        <div class="category-card-count">${cat.title}</div>
                    `;
                    card.onclick = (e) => {
                        e.preventDefault();
                        this.loadFile(file.path, file.displayName);
                    };
                    grid.appendChild(card);
                });
                this.showView('categoryView');
                this.updateTOC([]);
            },

            async loadFile(path, title) {
                try {
                    const response = await fetch(path);
                    if (!response.ok) {
                        throw new Error(`File not found (HTTP ${response.status}). Path: ${path}`);
                    }
                    let content = await response.text();
                    if (!content.trim()) {
                        throw new Error('File is empty');
                    }

                    const { html, headings } = this.markdownToHtml(content);
                    document.getElementById('fileContent').innerHTML = `<h1>${title}</h1>${html}`;
                    this.showView('fileView');
                    this.updateTOC(headings);
                    setTimeout(() => hljs.highlightAll(), 100);
                } catch (error) {
                    console.error('Load file error:', error);
                    const fileContent = document.getElementById('fileContent');
                    fileContent.innerHTML = `
                        <h1>${title}</h1>
                        <div style="background: rgba(255, 45, 32, 0.1); border-left: 4px solid #ff2d20; padding: 1rem; border-radius: 6px; margin-top: 1rem;">
                            <strong>Error loading file:</strong> ${error.message}
                            <br><small style="margin-top: 0.5rem; display: block; color: var(--text-secondary);">Path: ${path}</small>
                        </div>
                    `;
                    this.showView('fileView');
                    this.updateTOC([]);
                }
            },

            markdownToHtml(md) {
                let html = md;
                const headings = [];

                const languageAliases = {
                    'blade': 'html',
                    'html': 'html',
                    'php': 'php',
                    'js': 'javascript',
                    'ts': 'typescript',
                    'py': 'python',
                    'sh': 'bash',
                    'sql': 'sql',
                    'json': 'json',
                    'xml': 'xml',
                    'yaml': 'yaml',
                    'yml': 'yaml',
                    'css': 'css'
                };

                // Process code blocks
                html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                    const language = lang || 'plaintext';
                    const mappedLang = languageAliases[language.toLowerCase()] || language;
                    const trimmedCode = code.trim();

                    let highlighted = trimmedCode;
                    try {
                        highlighted = hljs.highlight(trimmedCode, { language: mappedLang }).value;
                    } catch (e) {
                        highlighted = trimmedCode;
                    }

                    const langLabel = language !== 'plaintext' ? `<div class="code-label">${language}</div>` : '';
                    return `<div class="code-block"><div class="code-block-header">${langLabel}</div><pre><code class="hljs language-${language}">${highlighted}</code></pre></div>`;
                });

                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

                // Collect headings for TOC
                html = html.replace(/^(#{1,6}) (.*?)$/gm, (match, hashes, title) => {
                    const level = hashes.length;
                    const id = title.toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
                    headings.push({ level, title, id });
                    const tag = `h${level}`;
                    return `<${tag} id="${id}">${title}</${tag}>`;
                });

                html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>');

                html = html.replace(/^\- (.*?)$/gm, '<li>$1</li>')
                    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

                html = html.split('\n\n')
                    .map(para => {
                        if (para.trim().startsWith('<h') || para.trim().startsWith('<ul') ||
                            para.trim().startsWith('<pre') || para.trim().startsWith('<div class="code-block"')) {
                            return para;
                        }
                        return para.trim() ? `<p>${para.trim()}</p>` : '';
                    })
                    .join('');

                return { html, headings };
            },

            updateTOC(headings) {
                const tocList = document.getElementById('tocList');
                tocList.innerHTML = '';

                if (headings.length === 0) {
                    tocList.innerHTML = '<li class="toc-item"><em style="color: var(--text-secondary); font-size: 0.9rem;">No headings</em></li>';
                    return;
                }

                headings.forEach(heading => {
                    const li = document.createElement('li');
                    li.className = `toc-item level-${heading.level}`;
                    const link = document.createElement('a');
                    link.href = `#${heading.id}`;
                    link.className = 'toc-link';
                    link.textContent = heading.title;
                    li.appendChild(link);
                    tocList.appendChild(li);
                });
            },

            search() {
                const query = document.getElementById('searchInput').value.toLowerCase();
                if (!query) {
                    this.showHome();
                    return;
                }

                const results = this.files.filter(file =>
                    file.displayName.toLowerCase().includes(query) ||
                    file.category.toLowerCase().includes(query)
                );

                if (results.length === 0) {
                    this.showView('emptyView');
                    return;
                }

                const resultsContainer = document.getElementById('searchResults');
                resultsContainer.innerHTML = '';
                results.forEach(file => {
                    const card = document.createElement('a');
                    card.className = 'category-card';
                    card.innerHTML = `
                        <div class="category-card-title">${file.displayName}</div>
                        <div class="category-card-count">${file.category}</div>
                    `;
                    card.onclick = (e) => {
                        e.preventDefault();
                        this.loadFile(file.path, file.displayName);
                    };
                    resultsContainer.appendChild(card);
                });

                this.showView('searchView');
                this.updateTOC([]);
            },

            showView(viewId) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
            },

            setupEventListeners() {
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', () => this.search());

                const themeToggle = document.getElementById('themeToggle');
                themeToggle.addEventListener('click', () => this.toggleTheme());

                document.addEventListener('keydown', (e) => {
                    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                        e.preventDefault();
                        searchInput.focus();
                    }
                });
            }
        };

        app.init();
    </script>
</body>
</html>
