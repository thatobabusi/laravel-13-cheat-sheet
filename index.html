<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laravel 13 Cheat Sheet - Organized Reference</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff2d20;
            --primary-light: #eb6f34;
            --primary-dark: #f97316;
            --bg: #fff;
            --bg-alt: #f9f9f9;
            --text: #333;
            --text-light: #666;
            --border: #e0e0e0;
            --success: #22c55e;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --bg-alt: #2d2d2d;
                --text: #e0e0e0;
                --text-light: #999;
                --border: #404040;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            margin-bottom: 3rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .header-subtitle {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 45, 32, 0.1);
        }

        .main-content {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 30px;
        }

        .sidebar {
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            margin-bottom: 0.5rem;
        }

        .category-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            background: var(--bg-alt);
            border: none;
            border-left: 3px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text);
            font-size: 14px;
            transition: all 0.2s;
        }

        .category-btn:hover {
            background: var(--border);
            border-left-color: var(--primary);
        }

        .category-btn.active {
            background: var(--primary);
            color: white;
            border-left-color: var(--primary-dark);
            font-weight: 600;
        }

        .content-area {
            min-height: 400px;
        }

        .content-view {
            display: none;
        }

        .content-view.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .section-title {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 1rem;
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 2rem;
        }

        .section-card {
            padding: 20px;
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .section-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(255, 45, 32, 0.15);
            transform: translateY(-2px);
        }

        .section-card-title {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .section-card-category {
            font-size: 12px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .file-view {
            background: var(--bg-alt);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .file-view h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .file-view code {
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 0.9em;
        }

        .file-view pre {
            background: #282c34;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.5rem 0;
            border: 1px solid var(--border);
            position: relative;
        }

        .file-view pre code {
            padding: 0;
            background: none;
            color: #abb2bf;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .code-label {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--text);
        }

        .markdown-content h1 {
            font-size: 1.8rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .markdown-content h2 {
            font-size: 1.5rem;
        }

        .markdown-content h3 {
            font-size: 1.2rem;
            color: var(--primary);
        }

        .markdown-content ul {
            margin-left: 2rem;
            margin-bottom: 1rem;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }

        .markdown-content p {
            margin-bottom: 1rem;
            line-height: 1.7;
        }

        .markdown-content strong {
            font-weight: 600;
            color: var(--primary);
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 8px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: var(--primary-light);
        }

        .search-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 2rem;
        }

        .search-result {
            padding: 15px;
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-result:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(255, 45, 32, 0.1);
        }

        .search-result-title {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .search-result-category {
            font-size: 12px;
            color: var(--text-light);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                max-height: auto;
                margin-bottom: 2rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .section-grid {
                grid-template-columns: 1fr;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Laravel 13 Cheat Sheet</h1>
            <p class="header-subtitle">Comprehensive reference organized by category • PHP 8.2+ • Quick lookup</p>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search topics (e.g., routing, eloquent, testing)..."
                    autofocus
                >
            </div>
        </header>

        <div class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <ul class="category-list" id="categoryList"></ul>
            </aside>

            <!-- Content Area -->
            <main class="content-area">
                <!-- Categories View -->
                <div id="categoriesView" class="content-view active">
                    <div class="section-title">📖 Browse by Category</div>
                    <div class="section-grid" id="categoriesGrid"></div>
                </div>

                <!-- File View -->
                <div id="fileView" class="content-view">
                    <button class="back-btn" onclick="app.showCategories()">← Back</button>
                    <div class="file-view" id="fileContent"></div>
                </div>

                <!-- Search Results View -->
                <div id="searchView" class="content-view">
                    <button class="back-btn" onclick="app.showCategories()">← Back</button>
                    <div class="section-title">🔍 Search Results</div>
                    <div class="search-results" id="searchResults"></div>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="content-view">
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>No files found. Try a different search.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const app = {
            files: [],
            categories: {},

            async init() {
                await this.loadFileIndex();
                this.renderCategories();
                this.setupEventListeners();
            },

            async loadFileIndex() {
                // Map of all files organized by category
                this.categories = {
                    '01-core': {
                        title: '📌 Core Framework',
                        files: [
                            { name: 'artisan', path: 'docs/cheatsheet/01-core/artisan.md' },
                            { name: 'application-bootstrap', path: 'docs/cheatsheet/01-core/application-bootstrap.md' },
                            { name: 'config', path: 'docs/cheatsheet/01-core/config.md' },
                            { name: 'routing', path: 'docs/cheatsheet/01-core/routing.md' },
                            { name: 'middleware', path: 'docs/cheatsheet/01-core/middleware.md' }
                        ]
                    },
                    '02-http': {
                        title: '🌐 HTTP',
                        files: [
                            { name: 'controllers', path: 'docs/cheatsheet/02-http/controllers.md' },
                            { name: 'requests', path: 'docs/cheatsheet/02-http/requests.md' },
                            { name: 'responses', path: 'docs/cheatsheet/02-http/responses.md' },
                            { name: 'redirects', path: 'docs/cheatsheet/02-http/redirects.md' },
                            { name: 'views-blade', path: 'docs/cheatsheet/02-http/views-blade.md' }
                        ]
                    },
                    '03-database': {
                        title: '💾 Database',
                        files: [
                            { name: 'eloquent-orm', path: 'docs/cheatsheet/03-database/eloquent-orm.md' },
                            { name: 'eloquent-scopes', path: 'docs/cheatsheet/03-database/eloquent-scopes.md' },
                            { name: 'factories', path: 'docs/cheatsheet/03-database/factories.md' },
                            { name: 'query-builder', path: 'docs/cheatsheet/03-database/query-builder.md' },
                            { name: 'schema-migrations', path: 'docs/cheatsheet/03-database/schema-migrations.md' }
                        ]
                    },
                    '04-auth': {
                        title: '🔐 Auth & Authorization',
                        files: [
                            { name: 'authentication-sanctum', path: 'docs/cheatsheet/04-auth/authentication-sanctum.md' },
                            { name: 'authorization', path: 'docs/cheatsheet/04-auth/authorization.md' }
                        ]
                    },
                    '05-communication': {
                        title: '💬 Communication',
                        files: [
                            { name: 'notifications', path: 'docs/cheatsheet/05-communication/notifications.md' },
                            { name: 'mail', path: 'docs/cheatsheet/05-communication/mail.md' }
                        ]
                    },
                    '06-utilities': {
                        title: '🛠️ Utilities',
                        files: [
                            { name: 'http-client', path: 'docs/cheatsheet/06-utilities/http-client.md' },
                            { name: 'cache', path: 'docs/cheatsheet/06-utilities/cache.md' },
                            { name: 'session', path: 'docs/cheatsheet/06-utilities/session.md' },
                            { name: 'cookies', path: 'docs/cheatsheet/06-utilities/cookies.md' },
                            { name: 'storage', path: 'docs/cheatsheet/06-utilities/storage.md' },
                            { name: 'logging', path: 'docs/cheatsheet/06-utilities/logging.md' }
                        ]
                    },
                    '07-patterns': {
                        title: '🏗️ Patterns',
                        files: [
                            { name: 'service-container', path: 'docs/cheatsheet/07-patterns/service-container.md' },
                            { name: 'service-providers', path: 'docs/cheatsheet/07-patterns/service-providers.md' }
                        ]
                    },
                    '08-data': {
                        title: '📊 Data Processing',
                        files: [
                            { name: 'collections', path: 'docs/cheatsheet/08-data/collections.md' },
                            { name: 'strings', path: 'docs/cheatsheet/08-data/strings.md' },
                            { name: 'arrays', path: 'docs/cheatsheet/08-data/arrays.md' },
                            { name: 'helpers', path: 'docs/cheatsheet/08-data/helpers.md' }
                        ]
                    },
                    '09-validation': {
                        title: '✅ Validation',
                        files: [
                            { name: 'validation', path: 'docs/cheatsheet/09-validation/validation.md' }
                        ]
                    },
                    '10-advanced': {
                        title: '🚀 Advanced',
                        files: [
                            { name: 'events-listeners', path: 'docs/cheatsheet/10-advanced/events-listeners.md' },
                            { name: 'jobs-queues', path: 'docs/cheatsheet/10-advanced/jobs-queues.md' },
                            { name: 'task-scheduling', path: 'docs/cheatsheet/10-advanced/task-scheduling.md' },
                            { name: 'testing', path: 'docs/cheatsheet/10-advanced/testing.md' }
                        ]
                    }
                };

                // Flatten for search
                this.files = [];
                Object.entries(this.categories).forEach(([key, cat]) => {
                    cat.files.forEach(file => {
                        this.files.push({
                            ...file,
                            displayName: file.name.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase()),
                            category: cat.title,
                            categoryKey: key
                        });
                    });
                });
            },

            renderCategories() {
                const grid = document.getElementById('categoriesGrid');
                const sidebar = document.getElementById('categoryList');

                grid.innerHTML = '';
                sidebar.innerHTML = '';

                Object.entries(this.categories).forEach(([key, cat]) => {
                    // Sidebar
                    const li = document.createElement('li');
                    li.className = 'category-item';
                    const btn = document.createElement('button');
                    btn.className = 'category-btn';
                    btn.textContent = cat.title;
                    btn.onclick = () => this.showCategory(key);
                    li.appendChild(btn);
                    sidebar.appendChild(li);

                    // Grid
                    const card = document.createElement('div');
                    card.className = 'section-card';
                    card.innerHTML = `
                        <div class="section-card-title">${cat.title}</div>
                        <div class="section-card-category">${cat.files.length} sections</div>
                    `;
                    card.onclick = () => this.showCategory(key);
                    grid.appendChild(card);
                });
            },

            async showCategory(categoryKey) {
                const cat = this.categories[categoryKey];
                const grid = document.getElementById('categoriesGrid');

                grid.innerHTML = '';
                this.categories[categoryKey].files.forEach(file => {
                    const card = document.createElement('div');
                    card.className = 'section-card';
                    card.innerHTML = `
                        <div class="section-card-title">${file.name.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</div>
                        <div class="section-card-category">${cat.title}</div>
                    `;
                    card.onclick = () => this.loadFile(file.path, file.displayName);
                    grid.appendChild(card);
                });

                document.getElementById('categoriesView').classList.add('active');
                document.querySelector('.section-title').textContent = `📖 ${cat.title}`;
            },

            async loadFile(path, title) {
                try {
                    const response = await fetch(path);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    let content = await response.text();

                    // Simple markdown to HTML conversion
                    content = this.markdownToHtml(content);

                    document.getElementById('fileContent').innerHTML = `
                        <h2>${title}</h2>
                        <div>${content}</div>
                    `;

                    this.showView('fileView');
                } catch (error) {
                    alert(`Failed to load file: ${error.message}`);
                }
            },

            markdownToHtml(md) {
                let html = md;

                // Process code blocks with language specification first
                html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                    const language = lang || 'plaintext';
                    const trimmedCode = code.trim();
                    const highlighted = hljs.highlight(trimmedCode, { language }).value;
                    const langLabel = language !== 'plaintext' ? `<div class="code-label">${language}</div>` : '';
                    return `${langLabel}<pre><code class="language-${language} hljs">${highlighted}</code></pre>`;
                });

                // Process inline code
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

                // Process headings
                html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>')
                    .replace(/^## (.*?)$/gm, '<h2>$1</h2>')
                    .replace(/^# (.*?)$/gm, '<h1>$1</h1>');

                // Process bold and italic
                html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>');

                // Process lists
                html = html.replace(/^\- (.*?)$/gm, '<li>$1</li>')
                    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

                // Process paragraphs
                html = html.split('\n\n')
                    .map(para => {
                        if (para.trim().startsWith('<h') || para.trim().startsWith('<ul') ||
                            para.trim().startsWith('<pre') || para.trim().startsWith('<div class="code-label"')) {
                            return para;
                        }
                        return para.trim() ? `<p>${para.trim()}</p>` : '';
                    })
                    .join('');

                return `<div class="markdown-content">${html}</div>`;
            },

            search() {
                const query = document.getElementById('searchInput').value.toLowerCase();

                if (!query) {
                    this.showCategories();
                    return;
                }

                const results = this.files.filter(file =>
                    file.displayName.toLowerCase().includes(query) ||
                    file.category.toLowerCase().includes(query)
                );

                if (results.length === 0) {
                    this.showView('emptyState');
                    return;
                }

                const resultsContainer = document.getElementById('searchResults');
                resultsContainer.innerHTML = '';

                results.forEach(file => {
                    const div = document.createElement('div');
                    div.className = 'search-result';
                    div.innerHTML = `
                        <div class="search-result-title">${file.displayName}</div>
                        <div class="search-result-category">${file.category}</div>
                    `;
                    div.onclick = () => this.loadFile(file.path, file.displayName);
                    resultsContainer.appendChild(div);
                });

                this.showView('searchView');
            },

            showCategories() {
                this.renderCategories();
                this.showView('categoriesView');
                document.getElementById('searchInput').value = '';
            },

            showView(viewId) {
                document.querySelectorAll('.content-view').forEach(v => v.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
            },

            setupEventListeners() {
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', () => this.search());

                // Keyboard shortcut
                document.addEventListener('keydown', (e) => {
                    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                        e.preventDefault();
                        searchInput.focus();
                    }
                });
            }
        };

        // Initialize app
        app.init();
    </script>
</body>
</html>
