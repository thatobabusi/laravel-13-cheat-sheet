# Jekyll Configuration for Laravel 13 Cheat Sheet
# GitHub Pages compatible configuration

title: Laravel 13 Cheat Sheet
description: Comprehensive reference for Laravel 13 organized by topic
url: https://thatobabusi.github.io/laravel-13-cheat-sheet
baseurl: /laravel-13-cheat-sheet

# Theme
theme: jekyll-theme-minimal

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Search plugin
search: true
search_full_content: true

# Collections for organizing content
collections:
  docs:
    output: true
    permalink: /:collection/:path/

# Exclude from build
exclude:
  - .github/
  - node_modules/
  - scripts/
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json

# Include hidden files
include:
  - .well-known

# Sass/SCSS
sass:
  style: compressed

# Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..3
